name: Update Coursier

on:
  workflow_dispatch:
    inputs:
      version:
        description: Coursier version to update to (defaults to the latest coursier release)
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/Paris

permissions:
  contents: write
  pull-requests: write

jobs:
  update-coursier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get Coursier version
        id: coursier
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            # only keep the "v*" tags, so that we ignore the rolling "nightly" release
            version=$(
              gh api 'repos/coursier/coursier/releases?per_page=100' \
                --jq 'map(select((.draft | not) and (.tag_name | startswith("v"))))[0].tag_name'
            )
          fi
          version=${version#v}
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected Coursier release version: $version"
            exit 1
          fi
          echo "Coursier version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update default Coursier version
        env:
          VERSION: ${{ steps.coursier.outputs.version }}
        shell: bash
        run: |
          sed -i -E \
            "s/^const defaultVersion = '[^']+'$/const defaultVersion = '$VERSION'/" \
            src/main.ts

      # Only pin the checksums of assets built by the coursier/coursier CI from the release tag.
      - name: Update Coursier checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.coursier.outputs.version }}
        shell: bash
        run: |
          assets=$(mktemp -d)
          gh release download "v$VERSION" --repo coursier/coursier --dir "$assets"
          for asset in "$assets"/*; do
            gh attestation verify "$asset" \
              --repo coursier/coursier \
              --source-ref "refs/tags/v$VERSION" \
              --deny-self-hosted-runners
          done
          (cd "$assets" && sha256sum -- *) | jq -R -n --arg version "$VERSION" \
            '{($version): [inputs | capture("^(?<sha>[0-9a-f]{64}) [ *](?<name>.+)$") | {(.name): .sha}] | add}' \
            > src/checksums.json
          rm -rf "$assets"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-coursier
          delete-branch: true
          commit-message: Update Coursier to ${{ steps.coursier.outputs.version }}
          title: Update Coursier to ${{ steps.coursier.outputs.version }}
          body: |
            Updates the default Coursier version to `${{ steps.coursier.outputs.version }}`, and pins the
            checksums of its launchers (after verifying their build provenance attestations).
