name: Test
on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        jvm: ['17', '25']
        include:
          - os: "macos-15"
            jvm: '21'
          - os: "ubuntu-24.04-arm"
            jvm: '21'
          - os: "windows-11-arm"
            jvm: '21'
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Build
      shell: bash -l {0}
      run: |
        npm ci
        test "$OSTYPE" != "msys" || npm run format
        npm run all

    # test extraJvmArgs — must run before the main setup so that apps and
    # JVM are not yet cached, forcing cs to fetch over the network and hit
    # the bogus proxy
    - name: Test extraJvmArgs passes args to cs
      uses: ./
      with:
        jvm: ${{ matrix.jvm }}
        extraJvmArgs: -Dhttps.proxyHost=invalid.proxy.local -Dhttps.proxyPort=9999
      continue-on-error: true
      id: extra-jvm-args-test
    - name: Verify extraJvmArgs caused failure
      shell: bash
      run: |
        if [ "${{ steps.extra-jvm-args-test.outcome }}" = "failure" ]; then
          echo "extraJvmArgs correctly passed to cs (proxy caused expected failure)"
        else
          echo "::error::extraJvmArgs test should have failed with bogus proxy but didn't"
          exit 1
        fi

    # create an sbt file to enable sbt caching
    - run: echo 'name := "foo"' > build.sbt
    - id: cs-setup
      uses: ./
      with:
        jvm: ${{ matrix.jvm }}
        version: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && 'nightly' || '' }}
        # Windows ARM64 has no native sbtn launcher yet
        apps: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && 'sbt ammonite bloop' || 'sbt sbtn ammonite bloop' }}

    # - uses: coursier/cache-action@v5
    - run: echo cs-version=${{ steps.cs-setup.outputs.cs-version }}
    - run: echo $PATH

    # test Java
    - run: echo $JAVA_HOME
    - run: java -version
    - run: cs java -version

    # test installed apps
    - run: sbt "show name"
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
    - run: sbtn.bat show name </dev/null
      shell: bash
      if: runner.os == 'Windows' && runner.arch != 'ARM64'
    - run: sbtn show name
      if: runner.os != 'Windows'
    - run: amm --help
    - run: bloop about

  test-jvm-launchers:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        launcher: ['thin', 'assembly']
        include:
          - os: "macos-15"
            launcher: 'thin'
          - os: "macos-15"
            launcher: 'assembly'
          - os: "ubuntu-24.04-arm"
            launcher: 'thin'
          - os: "ubuntu-24.04-arm"
            launcher: 'assembly'
          - os: "windows-11-arm"
            launcher: 'thin'
          - os: "windows-11-arm"
            launcher: 'assembly'
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Build
      shell: bash
      run: |
        npm ci
        npm run package

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - id: cs-setup-jvm-launcher
      uses: ./
      with:
        launcher: ${{ matrix.launcher }}
        apps: ''

    - run: echo cs-version=${{ steps.cs-setup-jvm-launcher.outputs.cs-version }}
    - run: cs --help
    - run: java -version

  test-nightly:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Build
      shell: bash
      run: |
        npm ci
        npm run package

    - id: cs-setup-nightly
      uses: ./
      with:
        version: nightly
        apps: ''

    - run: echo cs-version=${{ steps.cs-setup-nightly.outputs.cs-version }}
    - name: Verify nightly version output
      shell: bash
      run: |
        test "${{ steps.cs-setup-nightly.outputs.cs-version }}" = "nightly"
    - run: cs --help
